name: symbols

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt pytest

      - name: Run 三元九维符号体系单元测试
        run: python -m pytest tests/ -q

      - name: 生成并校验 19683 卦解读坐标系基线
        run: |
          python -c "import sys; sys.path.insert(0,'trigram'); from interpret import coordinate; print('coordinate OK:', coordinate([1,1,1,-1,0,1,1,1,1]))"
          python trigram/_gen_interpret_baseline.py
